name: Dependency Freshness

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_OUTDATED_VERSION: '0.19.0'
  CARGO_OUTDATED_SHA256: '648021f279e737e11f4be0f5967ae2a01d4d66f7a2e462a0b24ccd6dd5e6b372'
  NODE_VERSION: '22'

concurrency:
  group: dependency-freshness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-deps:
    name: Rust Dependency Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-outdated
        run: |
          archive="${RUNNER_TEMP}/cargo-outdated.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/kbknapp/cargo-outdated/releases/download/v${CARGO_OUTDATED_VERSION}/cargo-outdated-${CARGO_OUTDATED_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "${archive}"
          echo "${CARGO_OUTDATED_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" cargo-outdated
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Check for outdated direct Rust dependencies
        run: |
          cargo outdated --depth 1 --exit-code 1 || {
            echo "ERROR: There are outdated direct Rust dependencies."
            exit 1
          }

  web-deps:
    name: Web Dependency Freshness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Check frontend dependency freshness
        run: npm run deps:check
